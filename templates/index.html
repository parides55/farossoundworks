{% extends "base.html" %}

{% block content %}

    <section class="h-screen w-screen mb-16"> <!--Hero section-->
        <img class="object-cover w-full h-full opacity-60" src="{{ url_for('static', filename='images/hero-image-test.png' ) }}" alt="Hero image">
        <div class="space-y-4 absolute inset-y-1/3 inset-x-1/8">
            <div>
                <h1 class="h-display">Faros<br><em class="text-slate-deep">Soundworks</em></h1>
                <p class="text-ink-soft text-lg">Music Production &amp; Orchestral Recording · Spain</p>
            </div>
            <div>
                <a class="group btn hover:bg-paper hover:text-ink hover:-translate-y-1 transition-colors" href="{{ url_for('work') }}">Hear our work <span class="btn__beam group-hover:w-8"></span></a>
                <a class="btn bg-paper text-ink hover:bg-ink hover:text-paper transition-colors hover:-translate-y-1" href="{{ url_for('contact_us') }}">Request a quote</a>
            </div>
        </div>
    </section>

    <section class="section"><!--Who we are Section-->
        <h2 class="h-section">Who we are</h2>
    </section>

    <section class="section bg-paper-warm"><!--What we do Section-->
        <h2 class="h-section">What we do</h2>
    </section>

    <section class="section"><!--Our work Section-->
        <h2 class="h-section">Our work</h2>
    </section>

    <section class="section bg-paper-warm"><!--Start Project Section-->
        <div class="space-y-4 text-center">
            <p class="eyebrow">Start a project</p>
            <h2 class="h-section">Tell us what you're making. We'll light the way.</h2>
            <div>
                <a class="group btn hover:bg-paper hover:text-ink hover:-translate-y-1 transition-colors" href="{{ url_for('contact_us') }}">Request a quote <span class="btn__beam group-hover:w-8"></span></a>
                <a class="btn bg-paper text-ink hover:bg-ink hover:text-paper transition-colors hover:-translate-y-1" href="{{ url_for('facilities') }}">Tour our studios</a>
            </div>
        </div>
    </section>

{% endblock %}
